<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">NeoHub 合约平面</title>
  <desc id="desc">按运行职责组织 NeoHub 原生合约。</desc>
  <style>.title{font:22px Arial,"Microsoft YaHei",sans-serif;font-weight:700;fill:#102a43}.plane{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.head{font:16px Arial,"Microsoft YaHei",sans-serif;font-weight:700;fill:#0f172a}.item{font:13px Arial,"Microsoft YaHei",sans-serif;fill:#334155}.pending{fill:#fff7e6;stroke:#d97706;stroke-width:2;rx:12}.native{fill:#eef6ff;stroke:#2563eb;stroke-width:2;rx:12}</style>
  <text x="36" y="40" class="title">NeoHub 原生合约平面</text>
  <rect x="40" y="70" width="255" height="118" class="native"/><text x="62" y="100" class="head">链身份</text><text x="62" y="130" class="item">ChainRegistry</text><text x="62" y="154" class="item">GovernanceController</text>
  <rect x="325" y="70" width="255" height="118" class="native"/><text x="347" y="100" class="head">桥资产</text><text x="347" y="130" class="item">TokenRegistry</text><text x="347" y="154" class="item">SharedBridge</text>
  <rect x="610" y="70" width="255" height="118" class="native"/><text x="632" y="100" class="head">结算</text><text x="632" y="130" class="item">SettlementManager</text><text x="632" y="154" class="item">VerifierRegistry</text>
  <rect x="40" y="220" width="255" height="136" class="native"/><text x="62" y="250" class="head">数据可用性</text><text x="62" y="280" class="item">DARegistry</text><text x="62" y="304" class="item">DAValidator</text>
  <rect x="325" y="220" width="255" height="136" class="native"/><text x="347" y="250" class="head">消息</text><text x="347" y="280" class="item">MessageRouter</text><text x="347" y="304" class="item">L1TxFilter</text>
  <rect x="610" y="220" width="255" height="136" class="native"/><text x="632" y="250" class="head">排序者安全</text><text x="632" y="280" class="item">SequencerRegistry</text><text x="632" y="304" class="item">SequencerBond</text><text x="632" y="328" class="item">ForcedInclusion</text>
  <rect x="40" y="388" width="390" height="148" class="native"/><text x="62" y="418" class="head">挑战与欺诈</text><text x="62" y="448" class="item">OptimisticChallenge</text><text x="62" y="472" class="item">GovernanceFraudVerifier</text><text x="62" y="496" class="item">RestrictedExecutionFraudVerifier</text>
  <rect x="460" y="388" width="405" height="148" class="native"/><text x="482" y="418" class="head">紧急控制</text><text x="482" y="448" class="item">EmergencyManager</text><text x="482" y="472" class="item">Pause / resume / escape hatch</text>
  <rect x="900" y="70" width="220" height="466" class="pending"/><text x="922" y="104" class="head">待迁移为 native</text><text x="922" y="138" class="item">MpcCommitteeVerifier</text><text x="922" y="162" class="item">MpcCommitteeFraudVerifier</text><text x="922" y="186" class="item">ExternalBridgeRegistry</text><text x="922" y="210" class="item">ExternalBridgeEscrow</text><text x="922" y="234" class="item">ExternalBridgeBond</text><text x="922" y="284" class="item">ExternalBridgeStubVerifier:</text><text x="922" y="308" class="item">仅测试使用，不进生产</text>
  <text x="40" y="586" class="item">蓝色：本目录已实现的 native 合约。橙色：仍在 neo-n4 中作为 reference/parity 合约。</text>
</svg>
