<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">NeoHub 结算流程</title>
  <desc id="desc">Batch roots 和 proof payload 经过 DA、链注册、verifier 与 settlement 检查。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.box{fill:#fff;stroke:#334155;stroke-width:2;rx:10}.ok{fill:#ecfdf3;stroke:#16803c;stroke-width:2;rx:10}.txt{font:15px Arial,"Microsoft YaHei",sans-serif;fill:#111827}.small{font:12px Arial,"Microsoft YaHei",sans-serif;fill:#475569}.title{font:22px Arial,"Microsoft YaHei",sans-serif;font-weight:700;fill:#102a43}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="34" y="38" class="title">批次结算：从 L2 roots 到 L1 真相</text>
  <rect x="42" y="95" width="150" height="82" class="box"/><text x="72" y="126" class="txt">L2 执行</text><text x="60" y="150" class="small">有序交易 + receipt</text>
  <rect x="230" y="95" width="170" height="82" class="box"/><text x="268" y="126" class="txt">Batcher</text><text x="248" y="150" class="small">roots + public input</text>
  <rect x="438" y="45" width="170" height="82" class="box"/><text x="468" y="76" class="txt">DARegistry</text><text x="462" y="100" class="small">记录 commitment</text>
  <rect x="438" y="158" width="170" height="82" class="box"/><text x="462" y="189" class="txt">DAValidator</text><text x="466" y="213" class="small">检查 DA evidence</text>
  <rect x="648" y="95" width="185" height="82" class="box"/><text x="684" y="126" class="txt">ChainRegistry</text><text x="676" y="150" class="small">active chain + config</text>
  <rect x="873" y="95" width="185" height="82" class="box"/><text x="908" y="126" class="txt">VerifierRegistry</text><text x="905" y="150" class="small">proofType 分发</text>
  <rect x="873" y="225" width="185" height="82" class="ok"/><text x="904" y="256" class="txt">SettlementManager</text><text x="906" y="280" class="small">存储 finalized roots</text>
  <path d="M192 136 L230 136" class="line"/><path d="M400 136 C420 120 420 92 438 86" class="line"/><path d="M400 136 C420 150 420 190 438 199" class="line"/><path d="M608 199 C636 196 628 147 648 136" class="line"/><path d="M833 136 L873 136" class="line"/><path d="M966 177 L966 225" class="line"/><path d="M608 86 C700 40 900 42 966 95" class="line"/><path d="M740 177 C760 245 830 266 873 266" class="line"/>
  <text x="80" y="296" class="small">被接受的 roots 会成为 withdrawal、message 与 fraud recovery 的 L1 真相。</text>
</svg>
