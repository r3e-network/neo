<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
  <title id="title">NeoHub 桥与消息流程</title>
  <desc id="desc">Deposit、withdrawal 与 message 共同依赖 ChainRegistry、TokenRegistry、SharedBridge、MessageRouter 和 SettlementManager。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.box{fill:#fff;stroke:#334155;stroke-width:2;rx:10}.hub{fill:#e8f4ff;stroke:#1d4ed8;stroke-width:2;rx:10}.l2{fill:#ecfdf3;stroke:#16803c;stroke-width:2;rx:10}.txt{font:15px Arial,"Microsoft YaHei",sans-serif;fill:#111827}.small{font:12px Arial,"Microsoft YaHei",sans-serif;fill:#475569}.title{font:22px Arial,"Microsoft YaHei",sans-serif;font-weight:700;fill:#102a43}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="34" y="38" class="title">桥与消息流程</text>
  <rect x="50" y="78" width="140" height="72" class="box"/><text x="82" y="108" class="txt">Deposit</text><text x="72" y="132" class="small">L1 资产锁定</text>
  <rect x="50" y="260" width="140" height="72" class="box"/><text x="72" y="290" class="txt">Withdrawal</text><text x="70" y="314" class="small">L2 burn + proof</text>
  <rect x="250" y="78" width="160" height="72" class="hub"/><text x="286" y="108" class="txt">SharedBridge</text><text x="276" y="132" class="small">托管 + 消费</text>
  <rect x="250" y="260" width="160" height="72" class="hub"/><text x="285" y="290" class="txt">MessageRouter</text><text x="272" y="314" class="small">队列 + 防重放</text>
  <rect x="470" y="50" width="160" height="72" class="hub"/><text x="506" y="80" class="txt">ChainRegistry</text><text x="500" y="104" class="small">active chain</text>
  <rect x="470" y="150" width="160" height="72" class="hub"/><text x="506" y="180" class="txt">TokenRegistry</text><text x="498" y="204" class="small">资产映射</text>
  <rect x="470" y="285" width="160" height="72" class="hub"/><text x="492" y="315" class="txt">SettlementManager</text><text x="500" y="339" class="small">finalized roots</text>
  <rect x="710" y="78" width="170" height="72" class="l2"/><text x="750" y="108" class="txt">目标 L2</text><text x="732" y="132" class="small">消费 deposit msg</text>
  <rect x="710" y="260" width="170" height="72" class="l2"/><text x="750" y="290" class="txt">来源 L2</text><text x="738" y="314" class="small">withdraw/message root</text>
  <rect x="940" y="170" width="170" height="72" class="box"/><text x="990" y="200" class="txt">用户</text><text x="966" y="224" class="small">claim 或 consume</text>
  <path d="M190 114 L250 114" class="line"/><path d="M410 114 C440 100 440 86 470 86" class="line"/><path d="M410 114 C440 150 440 180 470 186" class="line"/><path d="M410 114 C500 124 615 124 710 114" class="line"/>
  <path d="M190 296 L250 296" class="line"/><path d="M410 296 L470 321" class="line"/><path d="M630 321 C660 310 680 300 710 296" class="line"/><path d="M880 296 C930 290 950 250 990 242" class="line"/>
  <path d="M630 321 C680 250 800 220 940 206" class="line"/><path d="M410 296 C450 260 450 220 470 186" class="line"/>
  <text x="64" y="384" class="small">桥和消息是不同用户流程，但都依赖 chain config、canonical hash、finalized roots 和一次性消费。</text>
</svg>
