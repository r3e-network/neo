<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">NeoHub system context</title>
  <desc id="desc">NeoHub sits on Neo L1 between users, L2 chains, Gateway, watchers, and foreign chains.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#355070"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#355070;stroke-width:2;rx:10}.hub{fill:#e8f4ff;stroke:#1b4d89;stroke-width:3;rx:14}
      .l2{fill:#ecfdf3;stroke:#18794e;stroke-width:2;rx:10}.ext{fill:#fff7e6;stroke:#a15c00;stroke-width:2;rx:10}
      .txt{font:16px Arial,sans-serif;fill:#1f2937}.small{font:13px Arial,sans-serif;fill:#4b5563}.title{font:22px Arial,sans-serif;font-weight:700;fill:#102a43}
      .line{stroke:#355070;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="40" y="42" class="title">NeoHub as the L1 native anchor</text>
  <rect x="50" y="92" width="170" height="86" class="box"/><text x="82" y="125" class="txt">Users</text><text x="82" y="150" class="small">wallets, dApps</text>
  <rect x="50" y="252" width="170" height="86" class="box"/><text x="82" y="285" class="txt">SDK / CLI</text><text x="82" y="310" class="small">relayers, tools</text>
  <rect x="310" y="64" width="210" height="110" class="l2"/><text x="348" y="102" class="txt">N4 L2 chain</text><text x="340" y="128" class="small">execution + L2 native contracts</text>
  <rect x="310" y="224" width="210" height="110" class="l2"/><text x="344" y="262" class="txt">Batcher / Prover</text><text x="344" y="288" class="small">roots, DA, proof payloads</text>
  <rect x="610" y="78" width="260" height="250" class="hub"/><text x="694" y="116" class="title">NeoHub</text><text x="642" y="152" class="small">ChainRegistry · TokenRegistry</text><text x="642" y="178" class="small">SharedBridge · MessageRouter</text><text x="642" y="204" class="small">SettlementManager · VerifierRegistry</text><text x="642" y="230" class="small">DA · Sequencer · Challenge</text><text x="642" y="256" class="small">Governance · Emergency</text><text x="642" y="292" class="small">Native contracts in r3e/neo-n3-core</text>
  <rect x="930" y="72" width="150" height="90" class="box"/><text x="964" y="108" class="txt">Gateway</text><text x="954" y="134" class="small">optional aggregation</text>
  <rect x="930" y="238" width="150" height="90" class="ext"/><text x="958" y="274" class="txt">Watchers</text><text x="944" y="300" class="small">foreign events</text>
  <rect x="930" y="392" width="150" height="90" class="ext"/><text x="946" y="428" class="txt">Foreign chains</text><text x="952" y="454" class="small">EVM, Tron, Solana</text>
  <path d="M220 135 C250 135 270 118 310 118" class="line"/><path d="M220 295 C250 295 270 280 310 280" class="line"/>
  <path d="M520 118 C560 118 570 128 610 148" class="line"/><path d="M520 280 C560 280 570 255 610 235" class="line"/>
  <path d="M870 142 C900 132 900 120 930 116" class="line"/><path d="M930 284 C900 282 900 264 870 252" class="line"/>
  <path d="M1005 392 L1005 328" class="line"/><path d="M610 292 C560 330 330 392 220 316" class="line"/>
  <text x="354" y="430" class="small">NeoHub stores L1 truth: admitted chains, escrow, finalized roots, messages, security state.</text>
</svg>
